name: Build & Deploy frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (enables corepack -> yarn)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (Yarn)
        run: corepack enable

      - name: Install dependencies (Yarn)
        working-directory: frontend
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build frontend (React CRA)
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
        run: |
          if [ -f yarn.lock ]; then
            yarn build
          else
            npm run build
          fi

      # Ensure your domain + Pi validation are in the deployed site
      - name: Copy domain + Pi verification into build
        run: |
          mkdir -p frontend/build/.well-known
          cp -R .well-known/* frontend/build/.well-known/ 2>/dev/null || true
          cp CNAME frontend/build/ 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (frontend/build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

