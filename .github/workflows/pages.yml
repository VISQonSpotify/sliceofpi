name: Build & Deploy frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (CRA)
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"   # set env var in CI
        run: npm run build

      - name: Copy domain + Pi verification
        run: |
          mkdir -p frontend/build/.well-known
          cp -R .well-known/* frontend/build/.well-known/ 2>/dev/null || true
          cp CNAME frontend/build/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - id: deployment
        uses: actions/deploy-pages@v4

        - name: Upload production-ready build
  uses: actions/upload-pages-artifact@v3
  with:
    path: frontend/build

- name: Deploy to GitHub Pages
  id: deployment
  uses: actions/deploy-pages@v4

