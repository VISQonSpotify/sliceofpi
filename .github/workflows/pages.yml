name: Build & Deploy frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Node 16 to avoid OpenSSL 3 / react-scripts error
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # Prefer Yarn if yarn.lock exists; fall back to npm
      - name: Enable Yarn (or install if corepack missing)
        run: corepack enable || npm i -g yarn

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: |
          if [ -f yarn.lock ]; then
            yarn build
          else
            npm run build
          fi

      - name: Copy domain + Pi verification into build
        run: |
          mkdir -p frontend/build/.well-known
          cp -R .well-known/* frontend/build/.well-known/ 2>/dev/null || true
          cp CNAME frontend/build/ 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (frontend/build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
